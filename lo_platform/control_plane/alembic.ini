# Alembic configuration for the Latent Ocean control plane.
#
# This is a standalone migration config separate from the main
# application. It manages: customers, plans, forks, usage_events.
#
# Usage:
#   cd lo_platform/control_plane
#   alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .

# Override with CONTROL_PLANE_DB_URL env var or edit directly.
sqlalchemy.url = postgresql://localhost:5432/latentocean_control

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
