version: '3.9'

services:
  # ─── Reverse Proxy ───
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: always

  # ─── Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://latentocean.com}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://latentocean.com}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /engine
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /engine
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      # Nato-sim back-channel (preserved from operations)
      - NATO_SIM_ACCESS_CODE=${NATO_SIM_ACCESS_CODE}
      - NATO_SIM_BACKEND_URL=${NATO_SIM_BACKEND_URL:-http://api:8000}
      # Range bridge (frontend Node -> backend Python BTUT). When set,
      # the schema-agnostic fingerprinter HTTP-bridges to run_btut_pipeline
      # in the api container; otherwise it falls back to Node-side.
      - BTUT_BRIDGE_URL=${BTUT_BRIDGE_URL:-http://api:8000}
      - FORMED_MODELS_DIR=/data/formed_models
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID:-}
    volumes:
      # Next.js /api/health + data-layer routes read validation artefacts
      # and BTUT caches at /data and /scripts. Read-only bind mounts
      # from the repo keep them fresh without re-building the image.
      - ./data:/data:ro
      - ./scripts:/scripts:ro
      # Formed-model store: writable, shared with api container so the
      # backend can read formed models for query-side computation if
      # the bridge is asked to.
      - ./data/formed_models:/data/formed_models:rw
    restart: always

  # ─── API Server ───
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    expose:
      - "8000"
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=latent-intelligence
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - APP_ENV=production
      - APP_DEBUG=false
      - CORS_ORIGINS=https://latentocean.com,https://www.latentocean.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_started
    volumes:
      - ./tcd-jepa:/app/tcd-jepa:ro
      - checkpoints:/app/checkpoints
      # Backend reads the data directory for nato-sim fixtures and can
      # also read formed-model artifacts written by the frontend.
      - ./data:/app/data
      - ./data/formed_models:/data/formed_models:rw
    restart: always

  # ─── Celery Worker ───
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tcd-jepa:/app/tcd-jepa:ro
      - checkpoints:/app/checkpoints
    command: celery -A app.celery_app worker -l info -Q crystallization,interpretation,reports --concurrency=2
    restart: always

  # ─── Celery Beat (Scheduler) ───
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat -l info --scheduler celery.beat:PersistentScheduler
    restart: always

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-latent_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-li}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-li} -d ${POSTGRES_DB:-latent_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Neo4j ───
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always

  # ─── MinIO (Object Storage) ───
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: always

  # ─── Elasticsearch ───
  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
  es_data:
  checkpoints:
