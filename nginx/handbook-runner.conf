# Handbook runner reverse-proxy fragment.
#
# Included from the main `server { ... }` block in nginx.conf via:
#     include /etc/nginx/handbook-runner.conf;
#
# Routes /api/handbook/* to the handbook-runner FastAPI service. The runner
# imposes its own size cap (16 KB) on the source field; this nginx cap is
# a coarser outer wall (32 KB) covering JSON envelope overhead.
location /api/handbook/ {
    proxy_pass http://handbook_runner;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Snippets run with a 10s wall-time budget in the sandbox. 15s gives
    # the runner room for compile + run + serialization without leaving
    # connections hanging on a stalled upstream.
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_connect_timeout 5s;

    # Source is capped at 16 KB by the runner itself; 32 KB covers the
    # JSON envelope (corpus name, headers, padding).
    client_max_body_size 32k;
}
