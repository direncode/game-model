[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "ocean-mcp"
version     = "1.1.0"
description = "MCP server for the OCEAN substrate-clustering language. Drop into Claude Desktop / Cursor / Goose / any MCP-compatible AI client."
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }
authors     = [
    { name = "LatentOcean", email = "hello@latentocean.com" },
]
keywords    = ["mcp", "ocean", "substrate-clustering", "ai-agents", "llm-tools", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core OCEAN runtime — these come from the latentocean-core wheel.
    # For v1.1 we vendor the language toolchain alongside this package
    # so installing ocean-mcp gives you everything in one shot.
    "numpy>=1.26",
    "scipy",
    "scikit-learn",
    "pandas",
]

[project.optional-dependencies]
# Heavy operators (TCD recursive loop) require torch.
# Skipping by default keeps the wheel light; users opt in.
heavy = ["torch>=2.4"]

[project.urls]
Homepage      = "https://latentocean.com"
Documentation = "https://latentocean.com/protocols#mcp"
Repository    = "https://github.com/direncode/lsx-latentocean"
Issues        = "https://github.com/direncode/lsx-latentocean/issues"

[project.scripts]
ocean-mcp = "ocean_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where    = ["src"]
include  = ["ocean_mcp*"]

[tool.setuptools.package-data]
ocean_mcp = [
    "stdlib/*.ocean",
    "py.typed",
]
