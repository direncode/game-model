[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "latentocean-ocean"
version     = "1.0.0"
description = "The OCEAN language CLI — compile, run, format, lint, and inspect OCEAN substrate-clustering programs."
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }
authors     = [
    { name = "LatentOcean", email = "hello@latentocean.com" },
]
keywords    = ["ocean", "substrate-clustering", "compiler", "cli", "latentocean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]

[project.scripts]
ocean = "ocean_cli.main:main"

[project.urls]
Homepage      = "https://latentocean.com"
Documentation = "https://latentocean.com/protocols"
Repository    = "https://github.com/direncode/lsx-latentocean"
Issues        = "https://github.com/direncode/lsx-latentocean/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where    = ["src"]
include  = ["ocean_cli*"]

[tool.setuptools.package-data]
ocean_cli = [
    "stdlib/*.ocean",
    "stdlib/**/*.ndjson",
    "templates/*.ocean",
    "_vendored/**/*.py",
]

[tool.setuptools.exclude-package-data]
ocean_cli = ["_vendored/**/__pycache__/**"]
