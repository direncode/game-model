# Example CET corpus: wireless power transmission across eras
#
# This is the smallest reproducible demo of CET. It contains 5 documents:
# three Tesla patents from 1897-1902, one modern Corum surface-wave patent,
# one Marconi radio patent as a control. The expected result is that Tesla
# and Corum classify together as "surface_wave" and Marconi classifies as
# "radiative".

corpus_name: "Example: Wireless Power Across Eras"

documents:
  - id: tesla_645576
    title: "Tesla System of Transmission of Electrical Energy (1897)"
    year: 1897
    regime: surface_wave
    file: documents/tesla_645576.txt

  - id: tesla_649621
    title: "Tesla Apparatus for Transmission of Electrical Energy (1900)"
    year: 1900
    regime: surface_wave
    file: documents/tesla_649621.txt

  - id: tesla_1119732
    title: "Tesla Apparatus for Transmitting Electrical Energy (Wardenclyffe, 1902)"
    year: 1902
    regime: surface_wave
    file: documents/tesla_1119732.txt

  - id: corum_9923385
    title: "Corum CPG Technologies Guided Surface Waves (2015)"
    year: 2015
    regime: surface_wave
    file: documents/corum_9923385.txt

  - id: marconi_586193
    title: "Marconi Transmitting Electrical Signals (1896, control)"
    year: 1896
    regime: radiative
    file: documents/marconi_586193.txt
