[project]
name = "latentocean-engine"
version = "0.1.0"
description = "Latent Ocean Structural Intelligence Engine"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
connectors = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
materializer = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
all = [
    "latentocean-engine[connectors,materializer]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
