# Starter corpus for the NATO Simulation.
#
# 30 hand-curated public sources covering NATO Eastern Flank context:
# Russia, Ukraine, Belarus, Baltic states, Turkey, alliance cohesion,
# hybrid warfare. Each URL points at a topic landing page or flagship
# publication; the harvester fetches the rendered HTML and extracts the
# main readable text.
#
# source_tier:
#   1 = institutional / government primary source
#   2 = major think tank / academic institution
#   3 = high-quality news / commentary
#
# If a URL 404s or becomes unavailable, the harvester logs a warning and
# skips it — the corpus does not require all 30 to succeed. Swap any
# row freely.

sources:
  # Institute for the Study of War (ISW)
  - { url: "https://www.understandingwar.org/backgrounder/russian-offensive-campaign-assessment", tier: 2, label: "ISW Russian Offensive Campaign Assessment", origin_tag: "starter:isw" }
  - { url: "https://www.understandingwar.org/backgrounder/belarus-weekly", tier: 2, label: "ISW Belarus Weekly", origin_tag: "starter:isw" }

  # CSIS
