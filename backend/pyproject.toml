[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-intelligence"
version = "0.1.0"
description = "Enterprise Structure Discovery Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "neo4j>=5.16.0",
    "minio>=7.2.3",
    "elasticsearch[async]>=8.12.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "anthropic>=0.18.0",
    "reportlab>=4.0.8",
    "python-docx>=1.1.0",
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    "user-agents>=2.2.0",
    "boto3>=1.34.0",
    "email-validator>=2.1.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
