[project]
name = "lo-cli"
version = "0.1.0"
description = "Latent Ocean CLI — structural intelligence from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "latentocean>=0.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
lo = "lo.main:app"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lo"]
