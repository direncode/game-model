# Prometheus scrape config for Latent Ocean production.
# Mount at /etc/prometheus/prometheus.yml in the prometheus container.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: prod
    service: latentocean

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: backend-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { component: backend }

  # Next.js frontend exposes the basic /api/health for uptime monitoring.
  # We treat a non-200 response as a scrape failure via blackbox_exporter
  # (below) rather than hitting /api/health directly from Prometheus.
  - job_name: frontend-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:3000/api/health
        labels: { component: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { component: postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { component: redis }
