# Alertmanager config.
#
# This file ships with a null receiver so the container boots cleanly
# without any credentials. When you're ready to wire pager / email /
# Slack, swap the `null` receiver for the tagged blocks below (they're
# kept as commented examples rather than placeholder URLs so the config
# validates out of the box).
#
# After editing:  docker compose restart alertmanager

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "null"

receivers:
  # Default "null" receiver: accepts alerts, does nothing. Safe to boot
  # with. Replace with one of the examples below.
  - name: "null"

  # EXAMPLE: Slack — uncomment + drop your webhook URL
  # - name: "slack"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  #       channel: "#latentocean-alerts"
  #       send_resolved: true
  #       title: '{{ .GroupLabels.alertname }} — {{ .CommonLabels.service }}'
  #       text: |-
  #         {{ range .Alerts }}*{{ .Annotations.summary }}*
  #         {{ .Annotations.description }}{{ end }}

  # EXAMPLE: PagerDuty — uncomment + drop your routing key
  # - name: "pagerduty"
  #   pagerduty_configs:
  #     - routing_key: "YOUR_PAGERDUTY_ROUTING_KEY"
  #       severity: critical
  #       description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

  # EXAMPLE: Email — uncomment + configure global.smtp_* above
  # - name: "email"
  #   email_configs:
  #     - to: "ops@latentocean.com"
  #       send_resolved: true

inhibit_rules:
  - source_match: { severity: critical }
    target_match: { severity: warning }
    equal: ["alertname", "service"]
