# Alertmanager config — routes alerts from Prometheus to the pager /
# email / Slack of your choice.
#
# Drop your real creds into the matching section, restart the
# alertmanager container (`docker compose restart alertmanager`),
# and Prometheus alerts defined in monitoring/rules/*.yml will fire
# through.
#
# Every placeholder in angle-brackets below is a template — replace
# <YOUR_SLACK_WEBHOOK_URL>, <YOUR_PAGERDUTY_ROUTING_KEY>, etc.

global:
  resolve_timeout: 5m
  smtp_smarthost: "<YOUR_SMTP_HOST>:587"
  smtp_from: "alerts@latentocean.com"
  smtp_auth_username: "<YOUR_SMTP_USER>"
  smtp_auth_password: "<YOUR_SMTP_PASS>"
  smtp_require_tls: true

route:
  # Group bursts of alerts about the same symptom so the on-call person
  # sees one page, not fifty.
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  # Escalation routes — the more severe the alert, the more channels.
  routes:
    - match: { severity: critical }
      receiver: critical
      continue: true
      repeat_interval: 30m
    - match: { severity: warning }
      receiver: warning
      continue: true

receivers:
  # The default receiver gets every alert — point this at the channel
  # the on-call engineer is watching right now (Slack is usually best
  # for bulk traffic).
  - name: default
    slack_configs:
      - api_url: "<YOUR_SLACK_WEBHOOK_URL>"
        channel: "#latentocean-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} — {{ .CommonLabels.service }}'
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  # Critical = page the on-call. Swap PagerDuty routing key in; if
  # you'd rather use Opsgenie / VictorOps / OnCall, the receiver block
  # shape is the same — Alertmanager speaks all four.
  - name: critical
    pagerduty_configs:
      - routing_key: "<YOUR_PAGERDUTY_ROUTING_KEY>"
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
    slack_configs:
      - api_url: "<YOUR_SLACK_WEBHOOK_URL>"
        channel: "#latentocean-pager"
        send_resolved: true

  # Warning = email the on-call only. No page.
  - name: warning
    email_configs:
      - to: "ops@latentocean.com"
        send_resolved: true

# Inhibit rules — silence lower-severity alerts while a higher-severity
# alert for the same symptom is firing, so the pager doesn't stack.
inhibit_rules:
  - source_match: { severity: critical }
    target_match: { severity: warning }
    equal: ["alertname", "service"]
