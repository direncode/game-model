name: Publish ocean-mcp

# Publishes both the PyPI package (Python) and the npm wrapper (Node)
# whenever a tag matching `ocean-mcp-v*` is pushed.
#
# Required secrets:
#   PYPI_API_TOKEN  — PyPI API token (from pypi.org → account settings)
#   NPM_TOKEN       — npm access token (from npmjs.com → access tokens)
#
# Tag and publish:
#   git tag ocean-mcp-v1.1.0 && git push origin ocean-mcp-v1.1.0
#
# The workflow vendors the OCEAN toolchain into the package on every
# build so the wheel always matches main.

on:
  push:
    tags:
      - "ocean-mcp-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (defaults to tag)"
        required: false
        type: string

jobs:
  build-and-publish-pypi:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # for trusted-publisher (preferred over API token)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Vendor OCEAN runtime into package
        run: |
          PKG=packages/ocean-mcp/src/ocean_mcp/_vendored
          mkdir -p $PKG/scripts/operators/ocean/stdlib
          cp scripts/operators/{__init__,source,embed,cluster,align,persist,schema,dsl}.py \
             $PKG/scripts/operators/ 2>/dev/null || true
          cp -r scripts/operators/ocean/* $PKG/scripts/operators/ocean/
          touch $PKG/scripts/__init__.py

      - name: Build wheel + sdist
        working-directory: packages/ocean-mcp
        run: python -m build

      - name: Verify wheel contents
        working-directory: packages/ocean-mcp
        run: |
          python -c "
          import zipfile, os, glob
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'no wheel'
          with zipfile.ZipFile(wheels[0]) as z:
              files = z.namelist()
              for must in ['lexer.py', 'compiler.py', 'mcp.py', 'cli.py', 'substrate.ocean']:
                  assert any(must in f for f in files), f'missing {must}'
              print(f'OK · {len(files)} files in wheel')
          "

      - name: Smoke-install the wheel
        working-directory: packages/ocean-mcp
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "
          import ocean_mcp
          assert ocean_mcp.__version__
          from scripts.operators.ocean.compiler import compile_ocean
          cfg = compile_ocean('load tmp/x.ndjson take 100 records')
          assert len(cfg['steps']) == 1
          print('OK · vendored runtime works')
          "

      - name: Upload to PyPI
        if: startsWith(github.ref, 'refs/tags/ocean-mcp-v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: packages/ocean-mcp
        run: twine upload dist/*

  build-and-publish-npm:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    needs: build-and-publish-pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Smoke test the bin wrapper structure
        working-directory: packages/ocean-mcp
        run: |
          node -e "const p = require('./package.json'); if (p.name !== '@latentocean/ocean-mcp') throw new Error('bad name')"
          test -f bin/ocean-mcp.js
          node --check bin/ocean-mcp.js
          echo "OK · package.json + bin/ocean-mcp.js valid"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/ocean-mcp-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/ocean-mcp
        run: npm publish --access public
